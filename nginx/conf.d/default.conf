# Upstream definitions
upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:3000;
}

# HTTP Server
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Health check
    location /health {
        proxy_pass http://backend/health;
        access_log off;
    }

    # API routes
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Next.js static files
    location /_next/ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static assets
    location ~* \.(ico|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot|css|js)$ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Homepage
    location = / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
    }

    # RAW ENDPOINT - Direct to backend (PURE TEXT, NO HTML)
    location ~ "^/([a-zA-Z0-9]{6,20})/raw$" {
        # Rewrite URL and pass to backend
        set $paste_id $1;
        proxy_pass http://backend/api/$paste_id/raw;
        
        # Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept "text/plain";
        
        # Disable buffering
        proxy_buffering off;
        proxy_set_header Accept-Encoding "";
    }

    # Short URL pattern - to frontend (with HTML UI)
    location ~ "^/([a-zA-Z0-9]{6,20})$" {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Everything else to frontend
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
